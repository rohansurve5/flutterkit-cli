name: flutterkit_cli
description: >-
  Add free FlutterKit screens straight into your Flutter project.
  Pull any screen by slug — no account, no key, no setup.
version: 0.3.1
publish_to: none

environment:
  sdk: ^3.5.0

executables:
  flutterkit: flutterkit

dependencies:
  args: ^2.6.0
  http: ^1.2.0
  path: ^1.9.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
