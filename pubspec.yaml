name: flutterkit_cli
description: >-
  Deliver paid FlutterKit Pro screens straight into your Flutter project.
  Log in with your license key and pull screens by slug.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.5.0

executables:
  flutterkit: flutterkit

dependencies:
  args: ^2.6.0
  http: ^1.2.0
  path: ^1.9.0

dev_dependencies:
  lints: ^5.0.0
